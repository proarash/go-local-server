name: Release

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.27.3"

      - name: Next version
        id: version
        run: |
          LAST=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          LAST=${LAST:-v0.0.0}
          IFS=. read -r MAJOR MINOR PATCH <<< "${LAST#v}"
          echo "tag=v$MAJOR.$MINOR.$((PATCH + 1))" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          mkdir -p out
          GOOS=linux   GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o out/gserver-linux-amd64 .
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o out/gserver-windows-amd64.exe .

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" out/* \
            --target "$GITHUB_SHA" --generate-notes
